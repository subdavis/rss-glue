{% include 'configs/base.html' %}

<div class="form-group">
  <label>Story Type *</label>
  <select name="story_type">
    {% for opt in ['top', 'new', 'best'] %}
    <option value="{{ opt }}" {% if form_values.story_type == opt %}selected{% endif %}>{{ opt }}</option>
    {% endfor %}
  </select>
  {% if errors.story_type %}<p class="field-error">{{ errors.story_type }}</p>{% endif %}
</div>
