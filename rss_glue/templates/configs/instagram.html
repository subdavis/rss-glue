{% include 'configs/base.html' %}

<div class="form-group">
  <label>Instagram Username *</label>
  <input type="text" name="username" value="{{ form_values.username or '' }}" required
    placeholder="username" />
  <small>Requires a ScrapeCreators API key set in global settings.</small>
  {% if errors.username %}<p class="field-error">{{ errors.username }}</p>{% endif %}
</div>
