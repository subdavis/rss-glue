{% include 'configs/base.html' %}

<div class="form-group">
  <label>Events Page URL *</label>
  <input type="url" name="url" value="{{ form_values.url or '' }}" required
    placeholder="https://example.com/events" />
  {% if errors.url %}<p class="field-error">{{ errors.url }}</p>{% endif %}
</div>

<div class="form-group">
  <label>Recurring Event Threshold *</label>
  <input type="number" name="recurring_threshold"
    value="{{ form_values.recurring_threshold or 3 }}" min="1" required />
  <small>De-duplicate recurring events that appear more than this many times.</small>
  {% if errors.recurring_threshold %}<p class="field-error">{{ errors.recurring_threshold }}</p>{% endif %}
</div>
