<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>{% block title %}RSS Glue{% endblock %}</title>
</head>

<style>
    nav a {
        font-weight: bold;
        font-family: monospace;
        padding: 0 10px;
    }

    article {
        max-width: 600px;
    }

    article img,
    article video {
        max-width: 100%;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 2px 8px;
        text-align: left;
    }

    th {
        background-color: #f0f0f0;
    }
</style>

<body>
    <nav>
        <a href="/">Feeds</a> |
        <a href="/gallery">Gallery</a> |
        <a href="/update-history">Update History</a> |
        <a href="/config">Config</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}

    <script>
        // Convert UTC timestamps to user's local timezone
        document.addEventListener('DOMContentLoaded', function () {
            const timeElements = document.querySelectorAll('[data-utc-time]');

            timeElements.forEach(function (element) {
                const utcTime = element.getAttribute('data-utc-time');
                if (!utcTime || utcTime === 'None') {
                    return;
                }

                try {
                    const date = new Date(utcTime);

                    // Format based on data-format attribute
                    const format = element.getAttribute('data-format') || 'datetime';

                    let formatted;
                    if (format === 'datetime') {
                        // Show full date and time
                        formatted = new Intl.DateTimeFormat(undefined, {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            hour12: false,
                        }).format(date);
                    } else if (format === 'date') {
                        // Show date only
                        formatted = new Intl.DateTimeFormat(undefined, {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit'
                        }).format(date);
                    } else if (format === 'relative') {
                        // Show relative time (e.g., "2 hours ago")
                        const now = new Date();
                        const diffMs = now - date;
                        const diffSec = Math.floor(diffMs / 1000);
                        const diffMin = Math.floor(diffSec / 60);
                        const diffHour = Math.floor(diffMin / 60);
                        const diffDay = Math.floor(diffHour / 24);

                        if (diffSec < 60) {
                            formatted = 'Just now';
                        } else if (diffMin < 60) {
                            formatted = diffMin + ' min ago';
                        } else if (diffHour < 24) {
                            formatted = diffHour + ' hour' + (diffHour > 1 ? 's' : '') + ' ago';
                        } else if (diffDay < 7) {
                            formatted = diffDay + ' day' + (diffDay > 1 ? 's' : '') + ' ago';
                        } else {
                            // Fall back to date format for older items
                            formatted = new Intl.DateTimeFormat(undefined, {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric'
                            }).format(date);
                        }
                    }

                    element.textContent = formatted;
                    element.setAttribute('title', date.toString()); // Show full datetime on hover
                } catch (e) {
                    console.error('Error parsing timestamp:', utcTime, e);
                }
            });
        });
    </script>
</body>

</html>
