[project]
name = "rss-glue"
version = "2.0.0"
description = "RSS feed aggregator and merger"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlmodel>=0.0.14",
    "jinja2>=3.1.0",
    "feedparser>=6.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "croniter>=2.0.0",
    "httpx>=0.26.0",
    "feedgen>=1.0.0",
    "argon2-cffi>=23.0.0",
    "itsdangerous>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "poethepoet>=0.40.0",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.ty.src]
exclude = ["v1", "prod.py"]


[tool.ruff]
exclude = ["v1", "prod.py"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.poe.tasks.validate]
parallel = ["lint", "type", "format"]

[tool.poe.tasks]
dev = "uvicorn rss_glue.main:app --reload --host 0.0.0.0"
devworker = "ENABLE_BACKGROUND_WORKER=true uvicorn rss_glue.main:app --reload"
worker = "python -m rss_glue.worker"
reset-password = "python -m rss_glue.scripts.reset_password"
test = "pytest"
lint = "ruff check"
type = "ty check"
format = "ruff format"
update-feeds = "uv run ./scripts/upload_config.py"